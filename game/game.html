<!DOCTYPE html>
<html lang="en" data-page="game">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>2048 - Gioca</title>
    <link rel="apple-touch-icon" href="images/icon.svg">
    <link rel="icon" href="images/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="scripts/translations.js"></script>
    <script defer src="scripts/game.js"></script>
</head>
<body>
    <header class="navbar-container">
        <nav class="navbar navbar-light bg-body-tertiary">
            <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between gap-2">
                <div class="d-flex align-items-center gap-2">
                    <a class="navbar-brand mb-0 h5" href="index.html"><strong>2048</strong></a>
                    <div class="score-display d-flex flex-column align-items-center px-2 py-1 border rounded-3 bg-body-secondary">
                        <div class="text-muted small" data-i18n="score">Score</div><div class="fs-6 fw-bold text-primary" id="score">0</div>
                    </div>
                    <div class="best-score-display d-flex flex-column align-items-center px-2 py-1 border rounded-3 bg-body-secondary">
                        <div class="text-muted small" data-i18n="bestScore">Best Score</div><div class="fs-6 fw-bold text-primary" id="best-score">0</div>
                    </div>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <button type="button" class="btn btn-success btn-sm compact-action" id="new-game-btn"><i class="bi bi-play-fill"></i><span class="ms-1 action-label" data-i18n="newGame">New Game</span></button>
                    <button type="button" class="btn btn-warning btn-sm compact-action" id="undo-btn"><i class="bi bi-arrow-counterclockwise"></i><span class="ms-1 action-label" data-i18n="undo">Undo</span><span class="badge bg-secondary ms-1" id="undo-count">0</span></button>
                    <button type="button" class="btn btn-outline-info btn-sm compact-action" id="export-btn"><i class="bi bi-download"></i><span class="ms-1 action-label" data-i18n="exportGame">Export</span></button>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Language"><input type="radio" class="btn-check" name="language" id="lang-it" value="it"><label class="btn btn-outline-primary language-option" for="lang-it" title="Italiano"><img src="images/it-flag.svg" alt="Italiano"></label><input type="radio" class="btn-check" name="language" id="lang-en" value="en" checked><label class="btn btn-outline-primary language-option" for="lang-en" title="English"><img src="images/uk-flag.svg" alt="English"></label></div>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="theme-toggle" title="Toggle theme"><i class="bi bi-moon"></i></button>
                    <button type="button" class="btn btn-info btn-sm" id="info-btn" title="Instructions" data-bs-toggle="modal" data-bs-target="#instructionsModal"><i class="bi bi-info-circle"></i></button>
                </div>
            </div>
        </nav>
    </header>
    <main class="game-main d-flex justify-content-center align-items-center"><div class="game-wrapper d-flex flex-column align-items-center justify-content-center w-100"><div class="game-container"><div class="board" id="board"></div></div></div></main>
    <div class="modal fade" id="instructionsModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" data-i18n="instructions">Instructions</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><ul class="mb-0"><li data-i18n="instr1">Use arrow keys or swipe to move tiles</li><li data-i18n="instr2">Combine tiles with the same number to create larger numbers</li><li data-i18n="instr3">The goal is to reach the 2048 tile</li><li data-i18n="instr4">You can undo up to 10 previous moves</li></ul></div></div></div></div>
    <div class="modal fade" id="gameOverModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" data-i18n="gameOver">Game Over</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body text-center"><div class="text-muted mb-2" data-i18n="finalScore">Final Score</div><div class="fs-1 fw-bold text-primary" id="final-score">0</div><div class="text-muted mb-2 mt-3" data-i18n="bestTile">Best Tile</div><div class="fs-2 fw-bold" id="best-tile">2</div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="close">Close</button><button type="button" class="btn btn-primary" id="replay-btn" data-bs-dismiss="modal" data-i18n="playAgain">Play Again</button></div></div></div></div>
    <div class="modal fade" id="victoryModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-success"><div class="modal-header bg-success text-white"><h5 class="modal-title" data-i18n="victory">🎉 You Won! 🎉</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body text-center"><div class="text-muted mb-2" data-i18n="finalScore">Final Score</div><div class="fs-1 fw-bold text-success" id="victory-score">0</div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="close">Close</button><button type="button" class="btn btn-success" id="continue-btn" data-bs-dismiss="modal" data-i18n="continue">Continue</button></div></div></div></div>
</body>
</html>
