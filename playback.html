<!DOCTYPE html>
<html lang="it" data-page="playback">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5e9">
    <title>2048 - Playback</title>
    <link rel="apple-touch-icon" href="images/icon.svg">
    <link rel="icon" href="images/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="scripts/translations.js"></script>
    <script defer src="scripts/game.js"></script>
</head>
<body>
    <header class="navbar-container"><nav class="navbar navbar-light bg-body-tertiary"><div class="container-fluid d-flex flex-wrap align-items-center justify-content-between gap-2">
        <a class="navbar-brand mb-0 h5" href="index.html"><strong>2048</strong> <span class="small fw-normal" data-i18n="playback">Playback</span></a>
        <div class="d-flex flex-wrap align-items-center gap-2">
            <label class="btn btn-outline-info btn-sm mb-0" for="recording-file"><i class="bi bi-folder2-open"></i><span class="ms-1" data-i18n="chooseFile">Apri partita</span></label><input class="visually-hidden" type="file" id="recording-file" accept=".2048,.json,application/json">
            <button type="button" class="btn btn-outline-primary btn-sm" id="start-playback-btn" disabled><i class="bi bi-play-circle"></i><span class="ms-1" data-i18n="startPlayback">Avvia</span></button>
            <div class="btn-group btn-group-sm" role="group" aria-label="Language"><input type="radio" class="btn-check" name="language" id="lang-it" value="it" checked><label class="btn btn-outline-primary language-option" for="lang-it" title="Italiano"><img src="images/it-flag.svg" alt="Italiano"></label><input type="radio" class="btn-check" name="language" id="lang-en" value="en"><label class="btn btn-outline-primary language-option" for="lang-en" title="English"><img src="images/uk-flag.svg" alt="English"></label></div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="theme-toggle" title="Toggle theme"><i class="bi bi-moon"></i></button>
        </div>
    </div></nav></header>
    <main class="game-main playback-main d-flex justify-content-center align-items-center"><div class="game-wrapper d-flex flex-column align-items-center justify-content-center w-100"><div class="playback-status text-center mb-3" id="playback-status" data-i18n="choosePlaybackFile">Scegli un file .2048 per visualizzare la partita</div><div class="playback-score d-flex gap-3 mb-3"><div class="score-display d-flex flex-column align-items-center px-3 py-1 border rounded-3 bg-body-secondary"><div class="text-muted small" data-i18n="score">Punteggio</div><div class="fs-6 fw-bold text-primary" id="score">0</div></div></div><div class="game-container"><div class="board" id="board"></div></div></div></main>
</body>
</html>
